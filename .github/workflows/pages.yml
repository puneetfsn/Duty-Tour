name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pages itself has to be switched on once, in Settings -> Pages ->
      # Source: GitHub Actions. The Arena GitHub integration has no Pages
      # permission, so it cannot create the site on your behalf.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          set -e
          mkdir -p _site
          # Only the files the browser needs — never tests, tooling, or node_modules.
          cp web/index.html web/styles.css web/app.js web/duty-tour.html _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
