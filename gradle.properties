# Project-wide Gradle settings for Duty Tour.

# AndroidX is used throughout (Compose, Room, DataStore, Navigation).
android.useAndroidX=true

# Only generate R classes for the resources a module actually declares.
android.nonTransitiveRClass=true

# Build performance on CI and on a laptop.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
